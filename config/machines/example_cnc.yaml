# =============================================================================
# AuraPredict — Edge Configuration Template
# Copy and rename per machine: torno_cnc_1.yaml, fresadora_cnc_2.yaml, etc.
# =============================================================================

machine:
  id: Torno_CNC_1             # Logical name — must match maquinas.nombre in DB
  empresa_id: 1                # Integer PK in empresas table
  tipo: torno_cnc              # torno_cnc | centro_mecanizado | fresadora_cnc
  rpm_nominal: 3000.0          # Nameplate RPM (never used as rpm_real)
  # maquina_id: 5              # Optional: integer PK in maquinas table.
                               # If set, allows offline startup without DB lookup.
                               # If absent, resolved from DB at pipeline startup.

sensor:
  type: mock                   # mock | adxl345 | iepe
  sampling_rate_hz: 3200.0     # Target/configured sampling rate (Hz)
  odr_hz: 3200.0               # ODR configured in sensor register (informational)
                               # IMPORTANT: 3200 Hz is a configuration target,
                               # NOT a hardware guarantee. Verify sampling_rate_actual
                               # in logs before relying on FFT above Nyquist/2.
  samples_per_window: 3200     # Samples per acquisition window (1 second at 3200 Hz)
  axes: [x, y, z]
  # i2c_address: "0x53"        # For ADXL345 (uncomment when using real hardware)

preprocessing:
  bandpass_low_hz: 10.0        # Low cutoff (Hz) — removes rigid body motion
  bandpass_high_hz: 1000.0     # High cutoff (Hz) — must be < Nyquist (fs/2)
  filter_order: 4              # Butterworth filter order
  detrend: linear              # linear | constant
  window_type: hann            # hann | hamming | blackman | flattop | rectangular
  bands:
    - {name: low,  low_hz: 10.0,  high_hz: 100.0}   # Low frequency band
    - {name: mid,  low_hz: 100.0, high_hz: 500.0}   # Mid frequency band
    - {name: high, low_hz: 500.0, high_hz: 1600.0}  # High frequency band

acquisition:
  primary_axis: x              # Axis used for frequency-domain DB columns
  include_total_axis: false    # Compute sqrt(x²+y²+z²) magnitude axis
  interval_normal_s: 120.0     # Seconds between readings in normal operation
  interval_anomaly_s: 30.0     # Seconds between readings when anomaly suspected

buffer:
  base_dir: /tmp/aurapredict/buffer   # Local offline buffer directory
  max_entries: 500                    # Max buffered readings before oldest is dropped

anomaly:
  # ── Baseline / cold start ──────────────────────────────────────────────────
  # The system starts with a Z-score detector and transitions to Isolation Forest
  # once enough 'normal' readings have been accumulated.
  baseline_min_samples: 50           # Minimum normal readings before activating IF
  update_every_n: 20                 # Retrain IF after every N new normal readings
  baseline_window_n: 200             # Rolling buffer size (readings kept in memory)
  z_score_threshold: 3.0             # Sigma threshold for cold-start Z-score detection

  # ── Isolation Forest ────────────────────────────────────────────────────────
  if_n_estimators: 50
  if_contamination: "auto"           # 'auto' or a float in [0.0, 0.5]
  model_base_dir: /tmp/aurapredict/models

  # ── Health score thresholds ─────────────────────────────────────────────────
  health_watch: 75                   # score ≥ 75 → OK - Sano / Bajo
  health_warning: 50                 # score ≥ 50 → ADVERTENCIA / Medio
  health_alert: 25                   # score ≥ 25 → ALERTA / Alto
                                     # score <  25 → NOK - Anomalía / CRÍTICO
  quality_min_threshold: 0.5         # Signal quality below this → health_score=None

  # ── RAW capture ─────────────────────────────────────────────────────────────
  capture_threshold: 50              # health_score below this triggers RAW save
  capture_cooldown_s: 3600.0         # Minimum seconds between RAW captures (1 hour)
  raw_base_dir: /tmp/aurapredict/raw # Directory for .npz raw event files

  # ── Alerts ──────────────────────────────────────────────────────────────────
  alert_cooldown_hours: 1.0          # Minimum hours between alerts per machine
  alert_emails: []                   # Email recipients (empty = no email in MVP)

sync:
  # ── Supabase Storage synchronisation (Fase 2D) ────────────────────────────
  # Set enabled: false to run in fully offline / local-only mode.
  enabled: true
  raw_bucket: aurapredict-raw-events    # bucket for .npz raw event files
  model_bucket: aurapredict-models      # bucket for .joblib model files
  max_raw_per_cycle: 5                  # max uploads per acquisition cycle

scheduler:
  # ── Edge Scheduler (Fase 3) ────────────────────────────────────────────────
  enabled: true
  run_24_7: true                    # No time-of-day restrictions
  interval_normal_minutes: 120      # health >= 75 → every 2 hours
  interval_watch_minutes: 30        # health 50-74 → every 30 minutes
  interval_alert_minutes: 5         # health < 50  → every 5 minutes
